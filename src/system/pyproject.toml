[project]
name = "agentflow-system"
version = "0.1.0"
description = "FastAPI control plane for AgentFlow"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "cryptography>=50,<51",
    "fastapi>=0.141,<0.142",
    "httpx>=0.28,<1",
    "pyjwt[crypto]>=2.10,<3",
    "redis>=7.4,<8",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn>=0.52,<0.53",
]

[dependency-groups]
dev = ["ruff>=0.16"]

[tool.ruff.lint.isort]
known-first-party = ["api", "core", "domain", "providers", "runtime", "services"]

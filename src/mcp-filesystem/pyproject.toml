[project]
name = "filesystem-mcp"
version = "0.1.0"
description = "A confined filesystem MCP server for AgentFlow demos"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.30,<2",
]

[project.scripts]
filesystem-mcp = "filesystem_mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.16"]

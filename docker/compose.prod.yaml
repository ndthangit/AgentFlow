name: agentflow-prod

x-server-logging: &server-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    restart: always
    ports: !reset []
    logging: *server-logging

  redis:
    restart: always
    ports: !reset []
    logging: *server-logging

  keycloak:
    restart: always
    environment:
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?Set KEYCLOAK_PUBLIC_URL in .env.prod}
      KC_HOSTNAME_STRICT: "true"
      KEYCLOAK_START_MODE: production
      KEYCLOAK_WEB_REDIRECT_URI: ${WEB_PUBLIC_URL:?Set WEB_PUBLIC_URL in .env.prod}/*
      KEYCLOAK_WEB_ORIGIN: ${WEB_PUBLIC_URL:?Set WEB_PUBLIC_URL in .env.prod}
      KEYCLOAK_USER_EMAIL: ${KEYCLOAK_USER_EMAIL:?Set KEYCLOAK_USER_EMAIL in .env.prod}
    ports: !override
      - "${KEYCLOAK_BIND_ADDRESS:-127.0.0.1}:${KEYCLOAK_PORT:-8080}:8080"
      - "${MANAGEMENT_BIND_ADDRESS:-127.0.0.1}:${KEYCLOAK_MANAGEMENT_PORT:-9000}:9000"
    volumes: !override
      - ./keycloak/agentflow-realm-prod.json:/opt/keycloak/data/import/agentflow-realm.json:ro
      - ./keycloak/entrypoint.sh:/opt/keycloak/bin/agentflow-entrypoint.sh:ro
    logging: *server-logging

  system:
    image: ${AGENTFLOW_SYSTEM_IMAGE:?Set AGENTFLOW_SYSTEM_IMAGE in .env.prod}
    build: !reset null
    pull_policy: always
    restart: always
    environment:
      ALLOW_PROVIDER_ENDPOINT_OVERRIDES: "false"
      ALLOW_CUSTOM_PROVIDER_PRIVATE_NETWORKS: "false"
      DEPLOYMENT_ENVIRONMENT: production
      OIDC_ISSUER: ${KEYCLOAK_PUBLIC_URL:?Set KEYCLOAK_PUBLIC_URL in .env.prod}/realms/agentflow
      WEB_ORIGINS: ${WEB_PUBLIC_URL:?Set WEB_PUBLIC_URL in .env.prod}
    ports: !override
      - "${SYSTEM_BIND_ADDRESS:-127.0.0.1}:${SYSTEM_PORT:-8000}:8000"
    logging: *server-logging

  agent-runtime-default-image:
    image: ${AGENTFLOW_AGENT_DEFAULT_IMAGE:?Set AGENTFLOW_AGENT_DEFAULT_IMAGE in .env.prod}
    build: !reset null
    pull_policy: always

  agent-runtime-codex-image:
    image: ${AGENTFLOW_AGENT_CODEX_IMAGE:?Set AGENTFLOW_AGENT_CODEX_IMAGE in .env.prod}
    build: !reset null
    pull_policy: always

  agent-runtime-opencode-image:
    image: ${AGENTFLOW_AGENT_OPENCODE_IMAGE:?Set AGENTFLOW_AGENT_OPENCODE_IMAGE in .env.prod}
    build: !reset null
    pull_policy: always

  agent-runtime-openhands-image:
    image: ${AGENTFLOW_AGENT_OPENHANDS_IMAGE:?Set AGENTFLOW_AGENT_OPENHANDS_IMAGE in .env.prod}
    build: !reset null
    pull_policy: always

  filesystem-mcp:
    image: ${AGENTFLOW_FILESYSTEM_MCP_IMAGE:?Set AGENTFLOW_FILESYSTEM_MCP_IMAGE in .env.prod}
    build: !reset null
    pull_policy: always
    restart: always
    ports: !reset []
    logging: *server-logging

  workflow-worker:
    image: ${AGENTFLOW_SYSTEM_IMAGE:?Set AGENTFLOW_SYSTEM_IMAGE in .env.prod}
    pull_policy: always
    restart: always
    environment:
      ALLOW_PROVIDER_ENDPOINT_OVERRIDES: "false"
      ALLOW_CUSTOM_PROVIDER_PRIVATE_NETWORKS: "false"
      DEPLOYMENT_ENVIRONMENT: production
      AGENT_RUNTIME_IMAGES: '{"default":"${AGENTFLOW_AGENT_DEFAULT_IMAGE:?Set AGENTFLOW_AGENT_DEFAULT_IMAGE in .env.prod}","codex":"${AGENTFLOW_AGENT_CODEX_IMAGE:?Set AGENTFLOW_AGENT_CODEX_IMAGE in .env.prod}","opencode":"${AGENTFLOW_AGENT_OPENCODE_IMAGE:?Set AGENTFLOW_AGENT_OPENCODE_IMAGE in .env.prod}","openhands":"${AGENTFLOW_AGENT_OPENHANDS_IMAGE:?Set AGENTFLOW_AGENT_OPENHANDS_IMAGE in .env.prod}"}'
      AGENT_RUNTIME_NETWORK: ${AGENT_RUNTIME_NETWORK:-agentflow-prod-runtime}
      AGENT_RUNTIME_PULL_POLICY: never
    logging: *server-logging

  web:
    image: ${AGENTFLOW_WEB_IMAGE:?Set AGENTFLOW_WEB_IMAGE in .env.prod}
    build: !reset null
    pull_policy: always
    restart: always
    ports: !override
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:80"
    logging: *server-logging

networks:
  runtime:
    name: ${AGENT_RUNTIME_NETWORK:-agentflow-prod-runtime}

x-langfuse-environment: &langfuse-environment
  NEXTAUTH_URL: ${LANGFUSE_PUBLIC_URL:-http://localhost:3002}
  DATABASE_URL: postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD:-change-langfuse-postgres-password}@langfuse-postgres:5432/langfuse
  SALT: ${LANGFUSE_SALT:-change-langfuse-salt}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
  TELEMETRY_ENABLED: ${LANGFUSE_TELEMETRY_ENABLED:-false}
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-change-langfuse-clickhouse-password}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:-change-langfuse-redis-password}
  REDIS_TLS_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_USER:-langfuse}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:-change-langfuse-minio-password}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_USER:-langfuse}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:-change-langfuse-minio-password}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"

services:
  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    restart: unless-stopped
    environment:
      <<: *langfuse-environment
      HOSTNAME: 0.0.0.0
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-change-langfuse-nextauth-secret}
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-agentflow-local}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-AgentFlow Local}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-agentflow}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-AgentFlow}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-agentflow-local}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-agentflow-local}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@agentflow.local}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-AgentFlow Admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-change-langfuse-admin-password}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://langfuse-minio:9000
    ports:
      - "127.0.0.1:${LANGFUSE_PORT:-3002}:3000"
    depends_on: &langfuse-depends-on
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    networks: [backend]

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    restart: unless-stopped
    environment:
      <<: *langfuse-environment
    depends_on: *langfuse-depends-on
    networks: [backend]

  langfuse-postgres:
    image: postgres:17.6-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:-change-langfuse-postgres-password}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - agentflow_langfuse_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:25.12
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-change-langfuse-clickhouse-password}
    volumes:
      - agentflow_langfuse_clickhouse:/var/lib/clickhouse
      - agentflow_langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks: [backend]

  langfuse-redis:
    image: redis:7.4.7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${LANGFUSE_REDIS_PASSWORD:-change-langfuse-redis-password}
      - --maxmemory-policy
      - noeviction
    volumes:
      - agentflow_langfuse_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${LANGFUSE_REDIS_PASSWORD:-change-langfuse-redis-password}
    networks: [backend]

  langfuse-minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_MINIO_USER:-langfuse}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD:-change-langfuse-minio-password}
    volumes:
      - agentflow_langfuse_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 3s
    networks: [backend]

  otel-collector:
    command: ["--config=/etc/otelcol-contrib/config-langfuse.yaml"]
    environment:
      LANGFUSE_OTLP_ENDPOINT: http://langfuse-web:3000/api/public/otel
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-agentflow-local}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-agentflow-local}
    volumes:
      - ./observability/otel-collector.langfuse.yaml:/etc/otelcol-contrib/config-langfuse.yaml:ro
    depends_on:
      langfuse-web:
        condition: service_started
    networks: [backend, runtime]

  system:
    environment:
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-true}
      LANGFUSE_MAX_IO_BYTES: ${LANGFUSE_MAX_IO_BYTES:-65536}
      OTEL_TRACES_SAMPLER_ARG: ${LANGFUSE_TRACES_SAMPLER_ARG:-1.0}

  workflow-worker:
    environment:
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-true}
      LANGFUSE_MAX_IO_BYTES: ${LANGFUSE_MAX_IO_BYTES:-65536}
      OTEL_TRACES_SAMPLER_ARG: ${LANGFUSE_TRACES_SAMPLER_ARG:-1.0}
      OPENINFERENCE_HIDE_INPUTS: ${OPENINFERENCE_HIDE_INPUTS:-false}
      OPENINFERENCE_HIDE_OUTPUTS: ${OPENINFERENCE_HIDE_OUTPUTS:-false}

volumes:
  agentflow_langfuse_postgres:
  agentflow_langfuse_clickhouse:
  agentflow_langfuse_clickhouse_logs:
  agentflow_langfuse_redis:
  agentflow_langfuse_minio:

name: agentflow

services:
  postgres:
    image: postgres:16.15-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agentflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  redis:
    image: redis:8.2.7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - agentflow_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  db-init:
    image: postgres:16.15-alpine3.24
    restart: "no"
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command:
      - sh
      - -ec
      - psql -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA IF NOT EXISTS system' -c 'CREATE SCHEMA IF NOT EXISTS keycloak'
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/opt/keycloak/bin/agentflow-entrypoint.sh"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8080
      KEYCLOAK_DEV_USER: ${KEYCLOAK_DEV_USER:?Set KEYCLOAK_DEV_USER in .env}
      KEYCLOAK_DEV_USER_ID: ${KEYCLOAK_DEV_USER_ID:?Set KEYCLOAK_DEV_USER_ID in .env}
      KEYCLOAK_DEV_USER_PASSWORD: ${KEYCLOAK_DEV_USER_PASSWORD:?Set KEYCLOAK_DEV_USER_PASSWORD in .env}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9000:9000"
    volumes:
      - ./infra/keycloak/agentflow-realm.json:/opt/keycloak/data/import/agentflow-realm.json:ro
      - ./infra/keycloak/entrypoint.sh:/opt/keycloak/bin/agentflow-entrypoint.sh:ro
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '200 OK' <&3"
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12
    networks: [backend]

  system:
    image: agentflow-system
    build:
      context: ./src/system
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AUTH_ENABLED: "true"
      OIDC_ISSUER: http://localhost:8080/realms/agentflow
      OIDC_AUDIENCE: agentflow-api
      OIDC_JWKS_URL: http://keycloak:8080/realms/agentflow/protocol/openid-connect/certs
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      REDIS_URL: redis://redis:6379/0
      WORKFLOW_QUEUE_STREAM: agentflow:workflow-runs
      WORKFLOW_QUEUE_GROUP: workflow-workers
      WORKFLOW_QUEUE_MAXLEN: ${WORKFLOW_QUEUE_MAXLEN:-10000}
      PROVIDER_SECRETS_KEY_FILE: /var/lib/agentflow/provider-secrets.key
      WEB_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - agentflow_system_secrets:/var/lib/agentflow
    depends_on:
      db-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    networks: [backend]

  agent-runtime-image:
    image: agentflow-agent-runtime:${AGENT_RUNTIME_IMAGE_VERSION:-0.1.0}
    build:
      context: ./src/agents
      dockerfile: Dockerfile
    entrypoint: ["/bin/true"]
    restart: "no"
    network_mode: none

  filesystem-mcp:
    image: agentflow-filesystem-mcp
    build:
      context: ./src/mcp-filesystem
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MCP_FILE_ROOT: /data
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8002
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - agentflow_mcp_files:/data
    networks: [runtime]

  workflow-worker:
    image: agentflow-system
    restart: unless-stopped
    command: ["python", "-m", "runtime.worker"]
    # Local-only supervisor access. Production should use a dedicated hardened
    # runner instead of mounting the Docker socket into a workflow worker.
    user: "0:0"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      REDIS_URL: redis://redis:6379/0
      WORKFLOW_QUEUE_STREAM: agentflow:workflow-runs
      WORKFLOW_QUEUE_GROUP: workflow-workers
      WORKFLOW_RECLAIM_IDLE_MS: ${WORKFLOW_RECLAIM_IDLE_MS:-300000}
      PROVIDER_SECRETS_KEY_FILE: /var/lib/agentflow/provider-secrets.key
      AGENT_RUNTIME_IMAGE: agentflow-agent-runtime:${AGENT_RUNTIME_IMAGE_VERSION:-0.1.0}
      AGENT_RUNTIME_TIMEOUT_SECONDS: ${AGENT_RUNTIME_TIMEOUT_SECONDS:-180}
      AGENT_RUNTIME_MAX_CONTAINERS: ${AGENT_RUNTIME_MAX_CONTAINERS:-2}
      AGENT_RUNTIME_CPUS: ${AGENT_RUNTIME_CPUS:-1}
      AGENT_RUNTIME_MEMORY: ${AGENT_RUNTIME_MEMORY:-1g}
      AGENT_RUNTIME_PIDS_LIMIT: ${AGENT_RUNTIME_PIDS_LIMIT:-128}
      AGENT_RUNTIME_NETWORK: ${AGENT_RUNTIME_NETWORK:-agentflow-runtime}
      AGENT_RUNTIME_MAX_OUTPUT_BYTES: ${AGENT_RUNTIME_MAX_OUTPUT_BYTES:-1048576}
      AGENT_RUNTIME_PULL_POLICY: never
    volumes:
      - agentflow_system_secrets:/var/lib/agentflow
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      system:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-runtime-image:
        condition: service_completed_successfully
      filesystem-mcp:
        condition: service_healthy
    healthcheck:
      disable: true
    networks: [backend]

  web:
    build:
      context: ./src/web
      dockerfile: Dockerfile
      args:
        VITE_SYSTEM_API_URL: http://localhost:8000
        VITE_KEYCLOAK_URL: http://localhost:8080
        VITE_KEYCLOAK_REALM: agentflow
        VITE_KEYCLOAK_CLIENT_ID: agentflow-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      system:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks: [backend]

volumes:
  agentflow_postgres:
  agentflow_redis:
  agentflow_system_secrets:
  agentflow_mcp_files:

networks:
  backend:
    driver: bridge
  runtime:
    name: agentflow-runtime
    driver: bridge

name: agentflow

services:
  postgres:
    image: postgres:16.15-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agentflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  db-init:
    image: postgres:16.15-alpine3.24
    restart: "no"
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command:
      - sh
      - -ec
      - psql -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA IF NOT EXISTS system' -c 'CREATE SCHEMA IF NOT EXISTS keycloak'
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/opt/keycloak/bin/agentflow-entrypoint.sh"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8080
      KEYCLOAK_DEV_USER: ${KEYCLOAK_DEV_USER:?Set KEYCLOAK_DEV_USER in .env}
      KEYCLOAK_DEV_USER_PASSWORD: ${KEYCLOAK_DEV_USER_PASSWORD:?Set KEYCLOAK_DEV_USER_PASSWORD in .env}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9000:9000"
    volumes:
      - ./infra/keycloak/agentflow-realm.json:/opt/keycloak/data/import/agentflow-realm.json:ro
      - ./infra/keycloak/entrypoint.sh:/opt/keycloak/bin/agentflow-entrypoint.sh:ro
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '200 OK' <&3"
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12
    networks: [backend]

  system:
    build:
      context: ./src/system
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AUTH_ENABLED: "true"
      OIDC_ISSUER: http://localhost:8080/realms/agentflow
      OIDC_AUDIENCE: agentflow-api
      OIDC_JWKS_URL: http://keycloak:8080/realms/agentflow/protocol/openid-connect/certs
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      AGENT_BASE_URL: http://agent:8001
      PROVIDER_SECRETS_KEY_FILE: /var/lib/agentflow/provider-secrets.key
      WEB_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - agentflow_system_secrets:/var/lib/agentflow
    depends_on:
      db-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    networks: [backend]

  web:
    build:
      context: ./src/web
      dockerfile: Dockerfile
      args:
        VITE_SYSTEM_API_URL: http://localhost:8000
        VITE_KEYCLOAK_URL: http://localhost:8080
        VITE_KEYCLOAK_REALM: agentflow
        VITE_KEYCLOAK_CLIENT_ID: agentflow-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      system:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks: [backend]

  agent:
    build:
      context: ./src/agent
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AUTH_ENABLED: "true"
      OIDC_ISSUER: http://localhost:8080/realms/agentflow
      OIDC_AUDIENCE: agentflow-api
      OIDC_JWKS_URL: http://keycloak:8080/realms/agentflow/protocol/openid-connect/certs
      AGENT_DEMO: ${AGENT_DEMO:-true}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-openai-compatible}
      AGENT_MODEL: ${AGENT_MODEL:-}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
    ports:
      - "127.0.0.1:8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      keycloak:
        condition: service_healthy
    networks: [backend]

volumes:
  agentflow_postgres:
  agentflow_system_secrets:

networks:
  backend:
    driver: bridge
